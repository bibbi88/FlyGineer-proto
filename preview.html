<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyGineer tablet preview</title>
<style>
  :root { --bg: #1b1f24; --panel: #262b31; --ink: #e8ecef; --muted: #9aa4ad; --line: #3a4148; --accent: #f4a21e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; margin-right: 6px; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  select, input, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=number] { width: 72px; }
  input[type=text] { width: 220px; }
  button { cursor: pointer; }
  button.on { background: var(--accent); color: #1b1f24; border-color: var(--accent); font-weight: 600; }
  #me { margin-left: auto; color: var(--muted); font-size: 12px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 16px; }
  #wrap { flex: none; }
  /* the tablet: black bezel around the screen */
  #device { transform-origin: top left; background: #0d0f11; border: 2px solid #2c3137; box-shadow: 0 20px 60px rgba(0,0,0,.5); position: relative; }
  #device::after { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #23282e; }
  iframe { display: block; border: 0; background: #fff; }
  #info { padding: 6px 14px 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>FlyGineer · tablet preview</b>
  <label>Device
    <select id="preset">
      <option value="1340x800x8.7">My tablet · 1340 × 800 (Galaxy Tab A9 8.7″)</option>
      <option value="1280x800x8">Galaxy Tab A 8.0 · 1280 × 800</option>
      <option value="962x601x8">Galaxy Tab A 8.0 · 962 × 601 (Chrome scaled 1.33)</option>
      <option value="custom">Custom…</option>
    </select>
  </label>
  <label>W <input type="number" id="w" min="200" max="4000"></label>
  <label>H <input type="number" id="h" min="200" max="4000"></label>
  <button id="rot" title="Turn the tablet">⟲ Portrait</button>
  <label>Size
    <select id="zoom">
      <option value="fit">Fit window</option>
      <option value="1">100 % (1 CSS px = 1 px)</option>
      <option value="real">Real size (approx.)</option>
    </select>
  </label>
  <label>Page <input type="text" id="url" value="index.html?demo"></label>
  <button id="go">Load</button>
  <span id="me"></span>
</header>
<div id="stage"><div id="wrap"><div id="device"><iframe id="app" allow="bluetooth; geolocation; fullscreen; screen-wake-lock"></iframe></div></div></div>
<div id="info"></div>
<script>
'use strict';
// Presets are WxHxDiagonal(inch). The owner's tablet reports 1340 x 800 (Galaxy Tab A9, 8.7"). Chrome may scale the
// pixels by the device's pixel ratio; open this page on the tablet itself to read the CSS size the app really gets.
const $ = (id) => document.getElementById(id);
const BEZEL_MM = 9; let DIAG_IN = 8.7;
let portrait = false;
try { const s = JSON.parse(localStorage.getItem('fg.preview2') || '{}'); if (s.preset) $('preset').value = s.preset; if (s.w) $('w').value = s.w; if (s.h) $('h').value = s.h; if (s.zoom) $('zoom').value = s.zoom; if (s.url) $('url').value = s.url; portrait = !!s.portrait; } catch (e) {}
function dims() { if ($('preset').value !== 'custom') { const [w, h, dg] = $('preset').value.split('x').map(Number); $('w').value = w; $('h').value = h; DIAG_IN = dg || 8.7; } let w = +$('w').value || 1340, h = +$('h').value || 800; if (w < h) [w, h] = [h, w]; return portrait ? [h, w] : [w, h]; }
function layout() {
  const [w, h] = dims(), f = $('app'), d = $('device');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  // bezel and its thickness in CSS px of this screen size: 8" diagonal across the screen
  const pxPerMm = Math.hypot(w, h) / (DIAG_IN * 25.4), bz = Math.round(BEZEL_MM * pxPerMm);
  d.style.padding = bz + 'px'; d.style.borderRadius = Math.round(bz * 1.3) + 'px';
  // camera dot in the bezel
  const dot = portrait ? `top:${bz / 2 - 4}px;left:calc(50% - 4px)` : `left:${bz / 2 - 4}px;top:calc(50% - 4px)`;
  document.getElementById('camcss')?.remove(); const s = document.createElement('style'); s.id = 'camcss'; s.textContent = `#device::after{${dot}}`; document.head.appendChild(s);
  const fw = w + 2 * bz + 4, fh = h + 2 * bz + 4, z = $('zoom').value, stage = $('stage');
  let k = 1;
  if (z === 'fit') k = Math.min((stage.clientWidth - 32) / fw, (stage.clientHeight - 32) / fh, 2);
  else if (z === 'real') k = (96 / 25.4) / pxPerMm; // CSS assumes 96 px per inch; real monitors differ a little
  d.style.transform = `scale(${k})`; $('wrap').style.width = fw * k + 'px'; $('wrap').style.height = fh * k + 'px';
  $('rot').textContent = portrait ? '⟲ Landscape' : '⟲ Portrait';
  $('info').textContent = `Screen ${w} × ${h} CSS px · ${(DIAG_IN * 25.4 * w / Math.hypot(w, h)).toFixed(0)} × ${(DIAG_IN * 25.4 * h / Math.hypot(w, h)).toFixed(0)} mm · shown at ${Math.round(k * 100)} %` + (z === 'real' ? ' (real size assumes 96 px per inch on this monitor; hold a ruler to check)' : '') + '. The app inside is the live page; settings and layouts are shared with the app opened normally in this browser.';
  try { localStorage.setItem('fg.preview2', JSON.stringify({ preset: $('preset').value, w: $('w').value, h: $('h').value, zoom: z, url: $('url').value, portrait })); } catch (e) {}
}
function load() { $('app').src = $('url').value || 'index.html?demo'; }
$('preset').onchange = layout; $('zoom').onchange = layout;
$('w').oninput = $('h').oninput = () => { $('preset').value = 'custom'; layout(); };
$('rot').onclick = () => { portrait = !portrait; layout(); };
$('go').onclick = () => { layout(); load(); };
$('url').onkeydown = (e) => { if (e.key === 'Enter') { layout(); load(); } };
addEventListener('resize', () => $('zoom').value === 'fit' && layout());
$('me').textContent = `This device: ${innerWidth} × ${innerHeight} CSS px · pixel ratio ${devicePixelRatio.toFixed(2)} · screen ${screen.width} × ${screen.height}`;
layout(); load();
</script>
</body>
</html>
