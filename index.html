<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F5F2">
<title>FlyGineer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top" aria-label="Pages menu">
  <nav id="tabs" aria-label="Pages">
    <button class="tab" data-page="pMap" aria-current="page">Map</button>
    <button class="tab" data-page="pThermal">Thermal</button>
    <button class="tab" data-page="pAtmos">Atmosphere</button>
    <button class="tab" data-page="pAir">Airspace</button>
    <button class="tab" data-page="pWeb">Web</button>
  </nav>
  <div class="msep" role="separator"></div>
  <button class="iconBtn" id="editBtn" aria-label="Edit map widgets"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 19l1-5L15 3l4 4L8 18z" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="mlbl">Edit widgets</span></button>
  <button class="iconBtn" id="setBtn" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="mlbl">Settings</span></button>
</header>
<div id="corner">
  <button id="modeChip" type="button" aria-label="Thermal mode">THERMAL</button>
  <button id="timeBtn" aria-label="Show local time and UTC"><span class="num" id="tLocal">--:--</span><small id="tUtc">--:-- UTC</small></button>
  <button id="statusBtn" aria-label="Battery and sensors. Open settings">
    <span class="bat"><b id="batMain">--</b><small id="batSub">no vario</small></span>
    <span class="dots">
      <span class="dot" id="dG">G<i></i></span>
      <span class="dot" id="dB">B<i></i></span>
      <span class="dot" id="dT">T<i></i></span>
      <span class="dot" id="dD">D<i></i></span>
    </span>
  </button>
  <button class="iconBtn" id="navBtn" aria-label="Show pages" aria-expanded="false" aria-controls="top"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><g id="navIco"><path d="M4 7h18M4 13h18M4 19h18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></g></svg></button>
</div>

<main>
<!-- MAP -->
<section class="page on" id="pMap">
  <div id="mapWrap">
    <div id="wLayer" class="wLayer" aria-label="Flight widgets"></div>
    <div id="warnBar" class="ov" role="alert"></div>
    <div id="demoBadge" class="ov chip">Demo flight running · data is simulated</div>
    <div id="replayBar" class="ov chip" role="group" aria-label="IGC replay">
      <button id="rpPlay" aria-label="Pause">❚❚</button>
      <span id="rpSpeeds" class="row" style="gap:4px"></span>
      <input type="range" id="rpSeek" min="0" max="1000" value="0" aria-label="Position in flight">
      <span id="rpTime">--:--:--</span>
      <button id="rpStop" aria-label="Stop replay">Stop</button>
    </div>
  </div>
</section>

<!-- THERMAL -->
<section class="page" id="pThermal"><div class="wLayer" id="wLayer_thermal" aria-label="Thermal widgets"></div></section>

<!-- ATMOSPHERE -->
<section class="page" id="pAtmos"><div class="wLayer" id="wLayer_atmos" aria-label="Atmosphere widgets"></div></section>

<!-- AIRSPACE -->
<section class="page" id="pAir"><div class="wLayer" id="wLayer_air" aria-label="Airspace widgets"></div></section>

<!-- WEB -->
<section class="page" id="pWeb">
  <div id="webBar">
    <button class="pill" data-web="windy" aria-pressed="true">Windy</button>
    <button class="pill" data-web="flyxc" aria-pressed="false">FlyXC</button>
    <button class="pill" data-web="flyk" aria-pressed="false">Flyk</button>
    <button class="pill" data-web="ais" aria-pressed="false">AIS NOTAM</button>
    <button class="pill" data-web="custom" aria-pressed="false" id="customTab">My page</button>
    <span class="chip" style="height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:20px;color:var(--sink);border-color:var(--sink);font-weight:600;font-size:14px">● Location shared</span>
    <span id="webExtra" class="row"></span>
    <button class="pill" id="webOpen" style="margin-left:auto">Open in browser</button>
  </div>
  <div id="webArea"></div>
</section>

<!-- SETTINGS -->
<section class="page" id="pSet">
  <nav id="setNav" aria-label="Settings sections"></nav>
  <div id="setBody"></div>
</section>
</main>

<div id="timeOv" role="status"><div><span id="toLocalL">LOCAL</span><b class="num" id="toLocal"></b></div><div style="width:1px;background:#4A5058"></div><div><span>UTC</span><b class="num" id="toUtc"></b></div></div>
<div id="toast" role="status"></div>
<div id="pgMenu" role="dialog" aria-label="All pages"><div class="card"></div></div>
<div id="wBanner" role="toolbar" aria-label="Edit map layout"><span style="font-size:14px"><b>Editing <span id="wbName">map</span></b> · drag to move, blue corners to resize, tap to configure</span><button id="wAdd">+ Add widget</button><button id="wReset">Reset</button><button class="primary" id="wDone">Done</button></div>
<aside id="wSheet" aria-label="Widget settings"></aside>
<div id="dlg" role="dialog" aria-modal="true"><div class="card" id="dlgBody"></div></div>

<script src="data/demo-flight.js"></script>
<script src="js/01-core.js"></script>
<script src="js/02-analysis.js"></script>
<script src="js/03-replay.js"></script>
<script src="js/04-map.js"></script>
<script src="js/05-data-sources.js"></script>
<script src="js/06-ui.js"></script>
<script src="js/07-widgets.js"></script>
<script src="js/08-actions.js"></script>
<script src="js/09-main.js"></script>
<script src="js/10-offline.js"></script>
</body>
</html>
