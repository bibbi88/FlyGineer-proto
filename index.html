<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F5F2">
<title>Bora Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<style>
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --ink:#111418; --muted:#4A5058; --line:#D5D8DC; --soft:#EEF0F2;
  --climb:#B54708; --climb2:#D97A3A; --climb3:#EDB78A; --sink:#1E50C8; --warn:#9A3D06; --warnbg:#FFF4E8;
  --air:#5B2FA6; --restr:#B42318; --ok:#2E7D4F; --overlay:rgba(255,255,255,0.88);
  --num:'Barlow Condensed','Arial Narrow',sans-serif; --txt:'Barlow','Helvetica Neue',Arial,sans-serif;
}
body.dark{
  --bg:#0E1216; --card:#161B21; --ink:#E6EAEE; --muted:#9AA3AD; --line:#2C3640; --soft:#1F262E;
  --climb:#F59E4B; --climb2:#E08A4B; --climb3:#8A5A33; --sink:#7FB2FF; --warn:#F2A65A; --warnbg:#2A1D10;
  --air:#B794F6; --restr:#FF8A7A; --ok:#5FC08A; --overlay:rgba(22,27,33,0.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--txt);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sink);outline-offset:2px}
.num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}

/* top bar */
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:8px;width:270px;max-height:calc(100dvh - 80px);overflow-y:auto;z-index:2000;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 12px 32px rgba(0,0,0,.25);transform-origin:top right;transform:translateY(-10px) scale(.97);opacity:0;visibility:hidden;pointer-events:none;transition:transform .16s ease-out,opacity .16s ease-out,visibility 0s .16s}
body.navOpen #top{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .16s ease-out,opacity .16s ease-out}
#top #tabs{flex-direction:column;gap:4px;overflow:visible}
#top .tab{width:100%;height:56px;text-align:left;padding:0 16px}
#top .msep{height:1px;background:var(--line);margin:4px 2px}
#top .iconBtn{width:100%;justify-content:flex-start;gap:12px;padding:0 16px;height:56px;font-weight:600;font-size:16px}
body.pinned #top{position:relative;top:0;right:auto;width:auto;max-height:none;overflow:visible;height:64px;flex-shrink:0;flex-direction:row;align-items:center;padding:6px 430px 6px 8px;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:none}
body.pinned #top #tabs{flex-direction:row;overflow-x:auto}
body.pinned #top .tab{width:auto;height:52px;text-align:center;padding:0 12px}
body.pinned #top .msep{flex:1;height:auto;background:none;margin:0}
body.pinned #top .iconBtn{width:52px;height:52px;padding:0;justify-content:center}
body.pinned #top .mlbl{display:none}
#corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:2100;display:flex;gap:6px;align-items:center}
#navBtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
body.pinned #navBtn{display:none}
body:not(.pinned) #thermCol,body:not(.pinned) #atmCol,body:not(.pinned) #airCol,body:not(.pinned) #setBody{padding-top:60px}
body.pinned #corner{top:calc(env(safe-area-inset-top,0px) + 6px)}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{min-width:88px;height:52px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#timeBtn{height:52px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1}
#timeBtn .num{font-size:22px}
#timeBtn small{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
#statusBtn{height:52px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px}
.bat{display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.bat b{font-size:15px}
.bat small{font-size:11px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700}
.dot i{width:8px;height:8px;border-radius:4px;border:2px solid var(--muted);display:block}
.dot.on i{background:var(--ink);border-color:var(--ink)}
.dot.bad{color:var(--warn)} .dot.bad i{border-color:var(--warn)}
.iconBtn{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconBtn[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* pages */
main{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none}
.page.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.pill{min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:6px;align-items:center}
.grow{flex:1;min-width:0}

/* map page */
#pMap{flex-direction:row}
#mapWrap{position:relative;flex:1;min-width:0}
#mapWrap{background:var(--bg)}
.wLayer{position:absolute;inset:0;z-index:450;pointer-events:none}
#pThermal .wLayer,#pAtmos .wLayer,#pAir .wLayer{z-index:1}
body:not(.pinned) #pThermal .wLayer,body:not(.pinned) #pAtmos .wLayer,body:not(.pinned) #pAir .wLayer{top:64px}
.wg{position:absolute;pointer-events:auto;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;padding:4px 8px;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
.wg .wl{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;line-height:1.2}
.wg .wv{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;flex:1;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.wg .ws{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.wg canvas{flex:1;min-height:0;width:100%;height:100%}
.wg .wh{display:none;position:absolute;width:32px;height:32px;background:var(--sink);touch-action:none;z-index:2}
.wg .wh::after{content:'';position:absolute;width:11px;height:11px;border:0 solid #fff}
.wg .wh.br{right:0;bottom:0;border-radius:12px 0 9px 0}.wg .wh.br::after{right:7px;bottom:7px;border-right-width:3px;border-bottom-width:3px}
.wg .wh.bl{left:0;bottom:0;border-radius:0 12px 0 9px}.wg .wh.bl::after{left:7px;bottom:7px;border-left-width:3px;border-bottom-width:3px}
.wg .wh.tr{right:0;top:0;border-radius:0 9px 0 12px}.wg .wh.tr::after{right:7px;top:7px;border-right-width:3px;border-top-width:3px}
.wg .wh.tl{left:0;top:0;border-radius:9px 0 12px 0}.wg .wh.tl::after{left:7px;top:7px;border-left-width:3px;border-top-width:3px}
.wcw{position:relative;flex:1;min-height:0}
.wcw canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.wbg{position:absolute;inset:0;z-index:0;display:none;overflow:hidden;border-radius:6px;pointer-events:none}
.wbg:not(.live),.wbg:not(.live) *{pointer-events:none!important}
.wbg.live{display:block;pointer-events:auto;border-radius:0}
body.wedit .wbg.live,body.wedit .wbg.live *{pointer-events:none!important}
.wctl{position:absolute;z-index:3;display:flex;flex-direction:column;gap:4px}
.wctl.l{left:2px;top:2px}.wctl.r{right:2px;bottom:2px}
.wg[data-type="map"]{padding:0;border-radius:4px}
.wg[data-type="map"] .wcw{border-radius:4px}
.wg[data-type="map"] .wctl.l{left:8px;top:8px;flex-direction:column;max-width:calc(100% - 16px)}
.wg[data-type="map"] .wctl.r{left:8px;right:auto;bottom:auto;top:50%;transform:translateY(-50%)}
.wg[data-type="map"] .wctl.l{z-index:4}
.wctl.b{left:50%;transform:translateX(-50%);bottom:18px;flex-direction:row}
.backOv{position:absolute;left:50%;transform:translateX(-50%);z-index:900;pointer-events:auto}
.backOv button{display:flex;align-items:center;gap:10px;height:60px;padding:0 26px;border-radius:30px;border:0;background:var(--sink);color:#fff;font:700 18px var(--txt);box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer}
.wcb.back{background:var(--sink);color:#fff;border-color:var(--sink);font-size:18px;height:60px;padding:0 24px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.numin{width:96px;height:56px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 24px var(--num);text-align:center;padding:0}
.pill.step{width:56px;height:56px;padding:0;font-size:26px}
.unit{font-weight:600;color:var(--muted)}
.wcb.big{min-width:56px;height:56px;font-size:26px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rbadge{position:absolute;right:3px;bottom:2px;font-size:11px;line-height:1;background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 4px}
.mmenu{position:absolute;top:62px;left:0;width:210px;max-height:60vh;overflow-y:auto;padding:6px;border-radius:14px;border:1px solid var(--line);background:var(--overlay);display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mmenu .mi{height:52px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;padding:0 12px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px}
.mmenu .mi[aria-selected="true"]{background:var(--ink);color:var(--bg)}
#modeChip{display:none;height:52px;padding:0 14px;border-radius:12px;border:2px solid var(--climb);background:var(--climb);color:#fff;font:700 14px var(--txt);letter-spacing:.06em;align-items:center;cursor:pointer}
#modeChip.cand{background:var(--card);color:var(--climb)}
.wcb{position:relative;min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--overlay);color:var(--ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.wcb.wide{width:auto;padding:0 12px;white-space:nowrap}
.wcb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
body.wedit .wctl{display:none}
body.wedit{--x:0}
body.wedit .wg{outline:2px dashed var(--sink);outline-offset:-2px;cursor:move}
body.wedit .wg.hidnow{opacity:.45}
body.wedit .wg[data-vis="thermal"]::after,body.wedit .wg[data-vis="glide"]::after{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:6;padding:2px 8px;border-radius:8px;background:var(--climb);color:#fff;font:700 10px var(--txt);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
body.wedit .wg[data-vis="thermal"]::after{content:"THERMALLING" attr(data-vd)}
body.wedit .wg[data-vis="glide"]::after{content:"STOPPED THERMALLING" attr(data-vd);background:var(--sink)}
body.wedit .wg.sel{outline:3px solid var(--sink)}
body.wedit .wg .wh{display:block}
body.wedit .wLayer{background-image:linear-gradient(to right,rgba(30,80,200,.10) 1px,transparent 1px),linear-gradient(to bottom,rgba(30,80,200,.10) 1px,transparent 1px);background-size:calc(100%/48) calc(100%/32)}
#wBanner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:2150;display:none;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:14px;background:#111418;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
body.wedit #wBanner{display:flex}
#wBanner button{height:52px;padding:0 14px;border-radius:12px;border:1px solid #4A5058;background:#111418;color:#fff;font-weight:600;font-size:15px}
#wBanner button.primary{background:#fff;color:#111418;border-color:#fff}
#wSheet{position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);z-index:2300;background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.2);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));overflow-y:auto;display:none;flex-direction:column;gap:12px}
#wSheet.on{display:flex}
#wSheet.left{right:auto;left:0;border-left:0;border-right:1px solid var(--line);box-shadow:10px 0 30px rgba(0,0,0,.2)}
#wSheet .wsHead{position:sticky;top:-14px;margin-top:-14px;padding:14px 0 6px;background:var(--card);z-index:3;touch-action:none;cursor:grab;user-select:none;flex-wrap:nowrap}
#wSheet .wsHead .grip{font-size:26px;color:var(--mute,#888);letter-spacing:-2px;padding:0 4px}
#wSheet .wsHead h2{flex:1;font-size:24px}
#wSheet .sub{padding-left:10px;border-left:3px solid var(--line)}
#pgMenu{position:fixed;inset:0;z-index:2600;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#pgMenu .card{background:var(--card);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:min(420px,90vw);box-shadow:0 12px 40px rgba(0,0,0,.35)}
#pgMenu .card b{grid-column:1/-1;font-family:var(--num);font-size:22px}
#pgMenu button{height:64px;font-size:18px}
#wSheet h2{margin:0;font-family:var(--num);font-size:26px}
#wSheet .opt{display:flex;flex-direction:column;gap:6px}
#wSheet .opt .row{flex-wrap:wrap}
#wSheet input[type=text],#wSheet select{height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.addGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.addGrid button{min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;text-align:left;padding:6px 12px}
.addGrid small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.w{padding:7px 10px}
.w .v{font-size:32px;line-height:1.05}
.w .s{font-size:12px;color:var(--muted)}
.w.big .v{font-size:68px;line-height:.9}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ov{position:absolute;z-index:500}
.chip{background:var(--overlay);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
#layerBtn{height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
#rotBtn{position:relative;width:56px;height:56px;padding:0;display:flex;align-items:center;justify-content:center}
#rotMode{position:absolute;right:4px;bottom:3px;font-size:12px;line-height:1;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 4px}
#layerMenu{position:absolute;top:56px;left:0;z-index:600;margin-top:6px;padding:6px;display:flex;flex-direction:column;gap:4px;width:220px}
#layerMenu[hidden]{display:none}
#mapTL{top:12px;left:12px}
#layerMenu button{height:56px;border:0;border-radius:10px;background:transparent;text-align:left;padding:0 12px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px}
#layerMenu button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sw{width:28px;height:28px;border-radius:7px;border:3px solid;flex-shrink:0}
#mapBtns{left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#mapBtns button{width:56px;height:56px;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center}
#warnBar{left:50%;transform:translateX(-50%);top:12px;padding:8px 14px;border-radius:10px;background:var(--warnbg);border:2px solid var(--warn);font-size:15px;display:none;max-width:60%}
#legend{left:12px;bottom:40px;padding:6px 10px;font-size:13px;display:flex;flex-direction:column;gap:3px}
#legend span{display:flex;align-items:center;gap:6px}
#demoBadge{left:50%;bottom:12px;transform:translateX(-50%);padding:6px 12px;font-weight:600;font-size:13px;display:none}
#replayBar{left:84px;right:84px;bottom:12px;padding:6px;display:none;align-items:center;gap:6px}
#replayBar button{height:48px;min-width:48px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
#replayBar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#replayBar input[type=range]{flex:1;min-width:80px;height:44px;accent-color:var(--ink)}
#rpTime{font-family:var(--num);font-weight:700;font-size:20px;min-width:74px;text-align:center}
.glider{width:40px;height:40px;margin:-20px 0 0 -20px}
.leaflet-container{font-family:var(--txt)}
.leaflet-control-attribution{font-size:10px}
.wpLabel{background:none;border:0;box-shadow:none;font-weight:700;font-size:13px;color:#111418;text-shadow:0 0 3px #fff,0 0 3px #fff}

/* thermal */
#pThermal{gap:10px;padding:10px}
#taCard{width:42%;display:flex;flex-direction:column;gap:6px;padding:10px}
#sideCard{width:26%;display:flex;flex-direction:column;gap:4px;padding:10px}
#thermCol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-y:auto}
canvas{display:block;width:100%;touch-action:none}
.cwrap{flex:1;min-height:0;position:relative}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%}

/* atmosphere */
#pAtmos{gap:10px;padding:10px}
#profCard{width:52%;display:flex;flex-direction:column;gap:6px;padding:10px}
#atmCol{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto}

/* airspace */
#pAir{gap:10px;padding:10px}
#asCard{width:54%;display:flex;flex-direction:column;gap:6px;padding:10px}
#miniMap{flex:1;border-radius:8px;min-height:200px}
#airCol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-y:auto}
.li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--soft);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:48px}
.badge{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px;border:2px solid var(--muted);color:var(--muted);min-width:60px;text-align:center}
.badge.act{background:var(--warn);border-color:var(--warn);color:#fff}
.freq{border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.freq.on{border:2px solid var(--sink);background:color-mix(in srgb,var(--sink) 10%,var(--card))}

/* web */
#pWeb{flex-direction:column}
#webBar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 430px 6px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
#webArea{flex:1;position:relative}
#webArea iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.webMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px}
.webMsg .card{max-width:520px;padding:20px;display:flex;flex-direction:column;gap:12px}

/* settings */
#pSet{gap:10px;padding:10px}
#setNav{width:190px;display:flex;flex-direction:column;gap:4px}
#setNav button{height:52px;text-align:left;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:600;font-size:15px}
#setNav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
#setBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:30px}
.sec{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-family:var(--num);font-size:24px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field>label,.field>span.k{width:190px;font-weight:600}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=url]{height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:220px;flex:1}
.wlist{display:flex;flex-direction:column;gap:4px}
.witem{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--soft)}
.witem button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.witem .nm{flex:1;font-weight:600}
.btn{height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{border:2px solid var(--warn);color:var(--warn)}

/* overlays */
#timeOv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3000;display:none;gap:36px;padding:24px 40px;border-radius:20px;background:rgba(17,20,24,.93);color:#fff;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#timeOv div{display:flex;flex-direction:column;align-items:center}
#timeOv span{font-size:14px;font-weight:600;letter-spacing:.1em;color:#C9CDD2}
#timeOv .num{font-size:88px;line-height:1}
#timeOv .num small{font-size:44px;color:#C9CDD2}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:2500;display:none;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--card);border:2px solid var(--ok);box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw}
#dlg{position:fixed;inset:0;z-index:2800;background:rgba(17,20,24,.45);display:none;align-items:center;justify-content:center}
#dlg .card{width:min(700px,94vw);max-height:86vh;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
pre.raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;white-space:pre-wrap;margin:0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}

@media (max-width:820px){
  #taCard{width:50%} #sideCard{display:none}
  #setNav{width:140px}
}
@media (orientation:portrait){
  #pMap{flex-direction:column}
  #pThermal,#pAtmos,#pAir{flex-direction:column;overflow-y:auto}
  #taCard,#sideCard,#profCard,#asCard{width:auto;min-height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  try {
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [NUS] });

function parseIGC(txt) {

  txt.split(/\r?\n/).forEach((l) => {

}

/* ================= update rate, thermal mode, export / import ================= */
let loopT = null;
function rateNow() { const r = st.thermMode && +S.rateT > 0 ? +S.rateT : +S.rate; return clamp(r || 0.4, 0.1, 5); }
function loop() { clearTimeout(loopT); try { tick(); } catch (e) { console.error(e); } loopT = setTimeout(loop, rateNow() * 1000); }
function enterThermal() { st.manual = 'on'; updateMode(); }
function leaveThermal() { st.manual = 'off'; st.offAt = 0; updateMode(); toast('Thermal mode off · starts again when you next circle'); }
function goPage(id) { if (curPage !== id) { st.prevPage = curPage; showPage(id); } }
function backPage() { if (st.prevPage && st.prevPage !== curPage) { const p = st.prevPage; st.prevPage = curPage; showPage(p); } }
function chipTap() {
  if (!st.thermMode) { enterThermal(); return; }
  const target = S.thermPage && S.thermPage !== 'off' ? S.thermPage : 'pThermal';
  if (curPage !== target) goPage(target); else backPage();
}
function updateMode() {
  const t = nowT(); let want;
  if (st.force) want = true;
  else if (st.manual === 'on') { want = true; if (st.circling) st.manual = null; }
  else if (st.manual === 'off') { want = false; if (!st.circling) { st.offAt = st.offAt || t; if (t - st.offAt > 3000) { st.manual = null; st.offAt = 0; } } else st.offAt = 0; }
  else if (S.modeAuto === false || S.modeAuto === 'false') want = false;
  else if (st.circling) { st.gliSince = 0; st.cirSince = st.cirSince || t; want = !!st.thermMode || t - st.cirSince >= (+S.modeEnter || 6) * 1000; }
  else { st.cirSince = 0; if (st.thermMode) { st.gliSince = st.gliSince || t; want = t - st.gliSince < (+S.modeHold || 20) * 1000; } else want = false; }
  if (want !== !!st.thermMode) setMode(want);
}
function setMode(on) {
  st.thermMode = on; if (!on) st.gliSince = 0;
  if (!wEdit && !st.force) {
    if (on && S.thermPage && S.thermPage !== 'off' && PAGEKEY[curPage] && curPage !== S.thermPage) { st.prevPage = curPage; st.autoSwitched = true; st.autoNav = true; showPage(S.thermPage); st.autoNav = false; }
    else if (!on && st.autoSwitched && S.thermBack !== false && S.thermBack !== 'false' && curPage === S.thermPage && st.prevPage) { st.autoNav = true; showPage(st.prevPage); st.autoNav = false; st.autoSwitched = false; }
  }
  if (!on && !(st.autoSwitched && curPage === S.thermPage)) st.autoSwitched = false;
  st.modeSince = nowT();
  renderTop(); renderWidgets(); clearTimeout(loopT); loopT = setTimeout(loop, rateNow() * 1000);
  fireEvent(on ? 'thermalStart' : 'thermalStop');
}
const NO_EXPORT = new Set(['openaipKey', 'notamProxy', 'layouts', 'layout', 'layoutGrid', 'widgets', 'hidden', 'mapMigrated']);
const IMPORT_OK = new Set(['uVario', 'uAlt', 'uSpd', 'avgS', 'wingLD', 'rotDefault', 'taOrient', 'layer', 'poiRadius', 'poiKinds', 'cylR', 'safety', 'theme', 'navMode', 'trig', 'flykUrl', 'notamRadius', 'sound', 'volume', 'wake', 'autoImport', 'customUrl', 'qnh', 'rate', 'rateT', 'modeAuto', 'modeEnter', 'modeHold', 'thermPage', 'thermBack', 'modeChip', 'autoRules']);
function downloadJSON(obj, name) { const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function buildExport(scope) {
  const o = { app: 'bora-flight', version: 1, exported: new Date().toISOString(), layoutGrid: GSC, layouts: JSON.parse(JSON.stringify(S.layouts)) };
  if (scope === 'all') { o.settings = {}; Object.keys(S).forEach((k) => { if (!NO_EXPORT.has(k)) o.settings[k] = S[k]; }); }
  return o;
}
function exportSettings(scope) {
  const d = new Date(), name = `bora-${scope === 'all' ? 'settings' : 'layouts'}-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.json`;
  downloadJSON(buildExport(scope), name); toast('Saved ' + name);
}
function cleanCfg(o) { const out = {}; if (o && typeof o === 'object') Object.keys(o).slice(0, 40).forEach((k) => { const v = o[k]; if (typeof v === 'number' ? isFinite(v) : typeof v === 'boolean') out[k] = v; else if (typeof v === 'string') out[k] = v.slice(0, 80); }); return out; }
function cleanW(k) {
  return (W) => {
    if (!W || typeof W !== 'object' || !WT[W.type]) return null;
    const w = clamp(Math.round((+W.w || WT[W.type].w * GSC) * k), 6, GC), h = clamp(Math.round((+W.h || WT[W.type].h * GSC) * k), 4, GR);
    const r = { id: newW(W.type).id, type: W.type, x: clamp(Math.round((+W.x || 0) * k), 0, GC - w), y: clamp(Math.round((+W.y || 0) * k), 0, GR - h), w, h, cfg: Object.assign({ size: 'auto', bg: 70, showLabel: true }, cleanCfg(W.cfg)) };
    if (W.cfgT && typeof W.cfgT === 'object') r.cfgT = cleanCfg(W.cfgT);
    return r;
  };
}
function parseImport(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { return { err: 'That file is not valid JSON.' }; }
  if (!o || o.app !== 'bora-flight') return { err: 'This is not a Bora Flight settings file.' };
  const k = GSC / (+o.layoutGrid || GSC), lay = {}; let nW = 0;
  Object.keys(LAYERID).forEach((pk) => { const a = o.layouts && o.layouts[pk]; if (Array.isArray(a)) { lay[pk] = a.map(cleanW(k)).filter(Boolean); nW += lay[pk].length; } });
  const sets = {}; if (o.settings && typeof o.settings === 'object') Object.keys(o.settings).forEach((key) => { const v = o.settings[key]; if (!IMPORT_OK.has(key)) return; if (key === 'autoRules') { sets[key] = cleanRules(v); return; } const d = DEF[key]; if (d !== undefined && typeof d !== typeof v) return; if (v !== null && typeof v === 'object' && key !== 'poiKinds') return; sets[key] = key === 'poiKinds' ? cleanCfg(v) : v; });
  return { lay, sets, nW, pages: Object.keys(lay).length, nSets: Object.keys(sets).length, date: o.exported };
}
function applyImport(P) {
  const backup = { layouts: JSON.parse(JSON.stringify(S.layouts)), settings: {} }; Object.keys(P.sets).forEach((k) => (backup.settings[k] = S[k]));
  const apply = (lay, sets) => { Object.assign(S.layouts, lay); Object.assign(S, sets); S.mapMigrated = true; save(); document.body.classList.toggle('dark', S.theme === 'dark'); document.body.classList.toggle('pinned', S.navMode === 'pinned'); drawTask(); loop(); renderWidgets(); if (curPage === 'pSet') renderSettings(); };
  apply(P.lay, P.sets);
  toast(`Imported ${P.nW} widgets on ${P.pages} pages${P.nSets ? ' and ' + P.nSets + ' settings' : ''}`, [['Undo', () => { apply(backup.layouts, backup.settings); toast('Import undone'); }]]);
}
function openImport(txt, fname) {
  const P = parseImport(txt); if (P.err) { toast(P.err); return; }
  $('dlgBody').innerHTML = `<div class="row" style="justify-content:space-between"><span class="num" style="font-size:26px">Import settings</span><button class="btn" id="dlgClose">Cancel</button></div>
    <div style="font-size:16px;line-height:1.45">${esc(fname || 'File')}${P.date ? ' · saved ' + esc(String(P.date).slice(0, 10)) : ''}<br><b>${P.nW} widgets</b> on <b>${P.pages} pages</b>${P.nSets ? ` and <b>${P.nSets} settings</b> (units, glide ratio, update rate, thermal mode …)` : ''}.</div>
    <div class="muted">This replaces the layout of the pages in the file. You can undo right after.</div>
    <div class="row"><button class="btn primary" id="impGo">Import and replace</button></div>`;
  $('dlg').style.display = 'flex'; $('dlgClose').onclick = () => ($('dlg').style.display = 'none'); $('impGo').onclick = () => { $('dlg').style.display = 'none'; applyImport(P); };
}

/* ================= automatic actions: when an event happens, optionally after a delay, do something ================= */
const AUTO_EVENTS = [['thermalStart', 'Started thermalling'], ['thermalStop', 'Stopped thermalling'], ['takeoff', 'Takeoff'], ['turnpoint', 'Turnpoint reached']];
const RULE_ACTS = ['pThermal', 'pMap', 'pAtmos', 'pAir', 'prev', 'center', 'soundOn', 'soundOff', 'time', 'start', 'message'];
const ruleActLabel = (a) => (a === 'message' ? 'Show a message' : (BTN[a] || [a])[0]);
const evLabel = (e) => (AUTO_EVENTS.find((x) => x[0] === e) || [e, e])[1];
st.autoQ = [];
function ruleSummary(r) { return `When ${evLabel(r.event).toLowerCase()}${+r.delay > 0 ? ', after ' + r.delay + ' s' : ''} → ${ruleActLabel(r.action).toLowerCase()}${r.action === 'message' && r.text ? ': “' + r.text + '”' : ''}`; }
function execRule(r) {
  const nav = /^p[A-Z]/.test(r.action) || r.action === 'prev';
  if (nav && (wEdit || !PAGEKEY[curPage])) return;                                                                          // never pull you out of Settings, Web or the widget editor
  const t = nowT(); st.autoLast = st.autoLast || {}; if (t - (st.autoLast[r.id] || -1e15) < 1000) return; st.autoLast[r.id] = t;   // never twice within a second
  runAction(r.action, r.text);
}
function scheduleAuto(sec) { setTimeout(runAutoPending, sec * 1000 / (st.replay ? st.replay.speed : 1) + 40); }
function fireEvent(ev) {
  if (st.force) return;                                                                                                     // the thermal-tab preview never triggers anything
  if (ev === 'thermalStop') st.autoQ = st.autoQ.filter((p) => p.ev !== 'thermalStart'); if (ev === 'thermalStart') st.autoQ = st.autoQ.filter((p) => p.ev !== 'thermalStop');
  (S.autoRules || []).forEach((r) => { if (r.on === false || r.event !== ev) return; const d = +r.delay || 0; if (d <= 0) execRule(r); else { st.autoQ.push({ ev, rule: r, due: nowT() + d * 1000 }); scheduleAuto(d); } });
}
function runAutoPending() { if (!st.autoQ.length) return; const t = nowT(), due = st.autoQ.filter((p) => p.due <= t || p.due - t > 3600000); if (!due.length) return; st.autoQ = st.autoQ.filter((p) => !due.includes(p)); due.forEach((p) => { if (p.due <= t) execRule(p.rule); }); }
function cleanRules(a) { if (!Array.isArray(a)) return []; return a.slice(0, 30).filter((r) => r && typeof r === 'object' && AUTO_EVENTS.some((e) => e[0] === r.event) && RULE_ACTS.includes(r.action)).map((r) => ({ id: 'ar' + Math.random().toString(36).slice(2, 8), on: r.on !== false, event: r.event, delay: clamp(Math.round(+r.delay || 0), 0, 600), action: r.action, text: String(r.text || '').slice(0, 80) })); }
function ruleCard(r, i) {
  const ev = AUTO_EVENTS.map(([k, n]) => `<button class="pill" data-ari="${i}" data-arf="event" data-arv="${k}" aria-pressed="${r.event === k}">${n}</button>`).join('');
  const acts = RULE_ACTS.map((a) => `<option value="${a}" ${r.action === a ? 'selected' : ''}>${esc(ruleActLabel(a))}</option>`).join('');
  return `<div class="card sec" style="${r.on === false ? 'opacity:.6' : ''}">
    <div class="row" style="justify-content:space-between"><b style="font-size:17px">Action ${i + 1}</b><span class="row"><button class="pill" data-ari="${i}" data-aron="1" aria-pressed="${r.on !== false}">${r.on !== false ? 'On' : 'Off'}</button><button class="pill" data-ari="${i}" data-arrun="1">Run now</button><button class="pill" data-ari="${i}" data-ardel="1" aria-label="Delete action">Delete</button></span></div>
    <div class="opt"><span class="lbl">When</span><div class="row" style="flex-wrap:wrap">${ev}</div></div>
    <div class="opt"><span class="lbl">After · 0 = immediately</span><div class="row"><button class="pill step" data-ari="${i}" data-arst="-1" aria-label="Less">−</button><input type="number" class="numin" inputmode="decimal" data-ari="${i}" data-arn="delay" value="${r.delay || 0}" min="0" max="600" step="1" aria-label="Delay in seconds"><span class="unit">s</span><button class="pill step" data-ari="${i}" data-arst="1" aria-label="More">+</button></div></div>
    <div class="opt"><label class="lbl" for="arA${i}">Do</label><select id="arA${i}" data-ari="${i}" data-arsel="action" style="height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%">${acts}</select></div>
    ${r.action === 'message' ? `<div class="opt"><label class="lbl" for="arT${i}">Message</label><input type="text" id="arT${i}" data-ari="${i}" data-artx="1" value="${esc(r.text || '')}" placeholder="Text to show" style="height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%"></div>` : ''}
    <div class="muted" style="font-size:14px">${esc(ruleSummary(r))}</div></div>`;
}
function autoSection() {
  const rules = S.autoRules || [];
  return `<div class="card sec"><h2>Automatic actions</h2>
    <div class="muted" style="line-height:1.45">Do something by itself when an event happens, optionally after a delay. A delayed action is cancelled if the opposite event comes first (for example thermalling stops before the delay is over). Pages are never changed while you are in Settings, Web or editing widgets.</div></div>
    ${rules.map(ruleCard).join('') || '<div class="card sec"><div class="muted">No automatic actions yet. Example: <b>When started thermalling → show Thermal page</b>, and <b>When stopped thermalling, after 20 s → previous page</b>.</div></div>'}
    <div class="card sec"><button class="btn primary" id="arAdd">+ Add action</button></div>`;
}
function ruleEdit(i, field, val) { const r = (S.autoRules || [])[i]; if (!r) return; if (field === 'delay') r.delay = clamp(Math.round(+val) || 0, 0, 600); else r[field] = val; save(); renderSettings(); }

/* ================= main loop ================= */
let lastSlow = 0;
function allTypes() { const t = new Set(); Object.values(S.layouts).forEach((L0) => L0.forEach((W) => t.add(W.type))); return t; }
function tick() {
  updateMode(); runAutoPending(); renderTop();
  if (PAGEKEY[curPage]) renderWidgets();
  if (curPage === 'pMap') renderWarn();
  const now = Date.now();
  if (now - lastSlow > 5000) {
    lastSlow = now; updateGround(); updatePrediction(); const ty = allTypes();
    if (ty.has('place') || ty.has('places') || ty.has('asmap')) loadPlaces();
    if (['cloud', 'cbase', 'ttop', 'outlook', 'groundT', 'profile'].some((t) => ty.has(t)) && !st.forecast && st.fix && !st.fcLoading && now - (st.fcTry || 0) > 60000) { st.fcTry = now; loadForecast(); }
    if (ty.has('notams') && !NOTAMS.length && now - (st.ntTry || 0) > 300000) { st.ntTry = now; loadNotams(); }
  }
}
function boot() {
  if (S.theme === 'dark') document.body.classList.add('dark');
  if (S.navMode === 'pinned') document.body.classList.add('pinned');
  try { const c = JSON.parse(localStorage.getItem('bora.notams') || 'null'); if (c) { NOTAMS = c.list; st.notamAt = c.at; } } catch (e) { }
  try { st.airspaces = JSON.parse(localStorage.getItem('bora.air') || '[]'); } catch (e) { st.airspaces = []; }
  if (typeof L === 'undefined') { document.querySelector('main').innerHTML = '<div style="padding:30px;font-size:18px">The map library could not load. Connect to the internet and reload.</div>'; return; }
  drawNotamAreas(); renderNotams();
  startGPS();
  const qp = new URLSearchParams(location.search); if (qp.get('p')) { importFlyXC('https://flyxc.app/?p=' + encodeURIComponent(qp.get('p'))); history.replaceState(null, '', location.pathname + (qp.has('demo') ? '?demo' : '')); }
  if (qp.has('demo')) startDemoFlight();
  loop();
}
boot();
</script>
